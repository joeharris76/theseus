version: 2
mode: enforce
status_context: review-verdict
findings_delivery: review
bot_login: beta-review
max_attempts: 5
protocol:
  max_defects: 10
  max_do_not_ship: 3
retry:
  daily_budget: 6
  backoff_start_minutes: 60
  sweep_max_dispatches: 5
omp:
  version: 18.13.3
  builds:
    linux-x64:
      url: https://build.stencil.so/d/omp/20261028-125026-413d278/omp-linux-x64
      sha256: 42d39fa8996fed9f999e26306e60e2fdbea0c0de0d0b2d68feba275f44c41d04
    linux-arm64:
      url: https://build.stencil.so/d/omp/20261028-125026-413d278/omp-linux-arm64
      sha256: 981f08df6c6344356b31aa696fdd810b8b5fa8c8851ba926d3940e793d47cc3a
    darwin-arm64:
      url: https://build.stencil.so/d/omp/20261028-125026-413d278/omp-darwin-arm64
      sha256: b449d0d0d779a0b2e655f0ce41d5c414a253de71c67b3affc30a6528fc967314
pools: [claude, codex]
reviewers:
  trivial:
    harness: omp
    family: codex
    pool: codex
    model: "@smol"
    effort: ""
    role: review
    read_only: hard
    reads_files: true
    timeout_minutes: 15
    enabled: true
  small:
    harness: omp
    family: codex
    pool: codex
    model: "@smol"
    effort: ""
    role: review
    read_only: hard
    reads_files: true
    timeout_minutes: 20
    enabled: true
  medium:
    harness: omp
    family: claude
    pool: claude
    model: "@default"
    effort: ""
    role: review
    read_only: hard
    reads_files: true
    timeout_minutes: 25
    enabled: true
  large:
    harness: omp
    family: claude
    pool: claude
    model: "@review"
    effort: ""
    role: review
    read_only: hard
    reads_files: true
    timeout_minutes: 30
    enabled: true
  huge:
    harness: omp
    family: claude
    pool: claude
    model: "@plan"
    effort: ""
    role: review
    read_only: hard
    reads_files: true
    timeout_minutes: 40
    enabled: true
  max:
    harness: omp
    family: claude
    pool: claude
    model: "@slow"
    effort: ""
    role: review
    read_only: hard
    reads_files: true
    timeout_minutes: 45
    enabled: true
buckets:
  trivial: trivial
  small: small
  medium: medium
  large: large
  huge: huge
  max: max
classifier:
  gate_paths:
    - .github/review.yml
    - .github/review-omp-config.yml
    - .github/theseus-lock.json
    - .github/workflows/review.yml
  logic_paths:
    - src/engine/*
    - "*compare*"
  data_paths:
    - data/*.golden
evidence:
  exempt_paths:
    - "README*.md"
    - "**/README*.md"
    - "CHANGELOG*.md"
    - "**/CHANGELOG*.md"
    - "docs/*.md"
consumer:
  gated_base: main
  attesters:
    - beta-owner
    - beta-deputy
  soundness_manifest: .github/soundness-paths.txt
  inert_manifest: .github/inert-paths.txt
  omp_config: .github/review-omp-config.yml
  omp_fixture_prefix: fixtures/omp
