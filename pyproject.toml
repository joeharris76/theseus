[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "theseus-reviewer"
version = "0.1.5"
description = "Reviews pull requests with AI models and blocks merging until a review of the exact commit has passed"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
theseus = "theseus_reviewer.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/theseus_reviewer"]

[tool.hatch.build.targets.sdist]
include = ["src/theseus_reviewer", "tests", "tools", "docs", "examples", ".github/workflows", "LICENSE", "README.md", "PROVENANCE.md", "UPSTREAM.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -n auto"
markers = [
    "unit: unit test",
    "fast: fast test",
    "integration: scenario test",
    "medium: medium-duration scenario test",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"
src = ["src", "tests", "tools"]
extend-exclude = ["src/theseus_reviewer/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
indent-style = "space"
