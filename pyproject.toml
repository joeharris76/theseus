[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "theseus-reviewer"
version = "0.1.0"
description = "Independent oracle reviewer and merge gate for pull requests"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
theseus = "theseus_reviewer.main:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/theseus_reviewer"]

[tool.hatch.build.targets.sdist]
include = ["src/theseus_reviewer", "tests", "tools", "LICENSE", "README.md", "PROVENANCE.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: unit test",
    "fast: fast test",
    "integration: scenario test",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
indent-style = "space"
