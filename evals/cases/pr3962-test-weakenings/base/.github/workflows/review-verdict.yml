name: review-verdict

on:
  pull_request_target:
    types: [opened, synchronize]

permissions: {}

jobs:
  verdict:
    permissions:
      contents: read
    uses: example/theseus/.github/workflows/review.yml@0000000000000000000000000000000000000000
    with:
      environment: review
      gated_base: develop
    secrets:
      REVIEW_APP_ID: ${{ secrets.ORACLE_APP_ID }}
      REVIEW_APP_PRIVATE_KEY: ${{ secrets.ORACLE_APP_PRIVATE_KEY }}
      REVIEW_GATEWAY_TOKEN: ${{ secrets.ORACLE_GATEWAY_TOKEN }}
      REVIEW_GATEWAY_URL: ${{ secrets.ORACLE_GATEWAY_URL }}
      TS_OAUTH_CI_CLIENT_ID: ${{ secrets.TS_OAUTH_CI_CLIENT_ID }}
      TS_OAUTH_CI_SECRET: ${{ secrets.TS_OAUTH_CI_SECRET }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
