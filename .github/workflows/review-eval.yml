name: review-eval

on:
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

concurrency:
  group: review-eval
  cancel-in-progress: false

jobs:
  eval:
    name: weekly live review eval
    if: github.repository == 'joeharris76/theseus'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: review-eval
    permissions:
      contents: read
    env:
      HAS_TAILNET: ${{ secrets.TS_OAUTH_CI_CLIENT_ID != '' && secrets.TS_OAUTH_CI_SECRET != '' }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the project
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: "3.13"

      - run: uv sync --locked

      - name: Join the tailnet to reach the credential gateway
        if: env.HAS_TAILNET == 'true'
        continue-on-error: true
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CI_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CI_SECRET }}
          tags: tag:theseus-ci

      - name: Score the reviewer against the incident corpus
        env:
          REVIEW_GATEWAY_URL: ${{ secrets.REVIEW_GATEWAY_URL }}
          REVIEW_CLOUD_GATEWAY_TOKEN: ${{ secrets.REVIEW_GATEWAY_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          RESULT_DIR: ${{ runner.temp }}/review-eval
        run: uv run -- python tools/review_eval.py run --mode live --compare --summary "$GITHUB_STEP_SUMMARY" --out "$RESULT_DIR/result.json"

      - name: Keep the result for the owner to record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-eval-result
          path: ${{ runner.temp }}/review-eval/result.json
          if-no-files-found: ignore
          retention-days: 90
