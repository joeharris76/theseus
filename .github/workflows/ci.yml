name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run -- ruff check .
      - run: uv run -- ruff format --check .
      - run: uv run -- pytest

  test-windows:
    name: test (windows, py${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run -- pytest tests/unit/test_bootstrap.py
      - name: Isolated first stage runs under python -I -S
        run: uv run -- python -I -S src/theseus_reviewer/bootstrap.py --help

  build:
    name: build and installed-wheel smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv build --out-dir "$RUNNER_TEMP/dist"
      - name: Install wheel into a clean venv outside the checkout and smoke it
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          uv venv --python 3.11 smoke-venv
          uv pip install --python smoke-venv/bin/python dist/theseus_reviewer-*.whl
          smoke-venv/bin/theseus --help
          smoke-venv/bin/python -I -c "import theseus_reviewer; print(theseus_reviewer.__file__)"

  review-eval:
    name: review eval corpus and score rule
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the eval corpus
        run: python3 tools/review_eval.py validate
      - name: Refuse a template, policy or guidance change that lowers the eval score
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(git rev-parse 'HEAD^1')"
          tool=tools/review_eval.py
          if git cat-file -e "$base:$tool" 2>/dev/null; then
            git show "$base:$tool" > "$RUNNER_TEMP/review_eval_base.py"
            tool="$RUNNER_TEMP/review_eval_base.py"
          fi
          python3 "$tool" --root "$GITHUB_WORKSPACE" check-change --base "$base" --head HEAD
