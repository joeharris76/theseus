version: 2
mode: enforce
status_context: review-verdict
findings_delivery: review
bot_login: theseus-review
consumer:
  gated_base: main
  attesters:
    - joeharris76
  soundness_manifest: .github/soundness-paths.txt
  omp_config: .github/review-omp-config.yml
max_attempts: 5
protocol:
  max_defects: 10
  max_do_not_ship: 3
retry:
  daily_budget: 6
  backoff_start_minutes: 60
  sweep_max_dispatches: 5
omp:
  version: 18.16.0
  builds:
    linux-x64:
      url: https://build.stencil.so/d/omp/20261102-194957-650f3a1/omp-linux-x64
      sha256: 6498ed785bab00d2926e0387e0ec02362d6d45f1c3d0d1b57c1618b7f95c9264
    linux-arm64:
      url: https://build.stencil.so/d/omp/20261102-194957-650f3a1/omp-linux-arm64
      sha256: c2be1ea85ce17c4270854b57efff2a7ea1d5a03c7557fd08721f2b9bb32698de
    darwin-arm64:
      url: https://build.stencil.so/d/omp/20261102-194957-650f3a1/omp-darwin-arm64
      sha256: d4a10d97488d6054d2b18198bd24f461079952c7e0fb75ba66336ca0df0cb99e
pools: [claude, codex]
reviewers:
  trivial:
    harness: omp
    family: codex
    pool: codex
    model: "@smol"
    effort: ""
    role: review
    read_only: hard
    reads_files: true
    timeout_minutes: 15
    enabled: true
  small:
    harness: omp
    family: codex
    pool: codex
    model: "@smol"
    effort: ""
    role: review
    read_only: hard
    reads_files: true
    timeout_minutes: 20
    enabled: true
  medium:
    harness: omp
    family: claude
    pool: claude
    model: "@default"
    effort: ""
    role: review
    read_only: hard
    reads_files: true
    timeout_minutes: 25
    enabled: true
  large:
    harness: omp
    family: claude
    pool: claude
    model: "@review"
    effort: ""
    role: review
    read_only: hard
    reads_files: true
    timeout_minutes: 30
    enabled: true
  huge:
    harness: omp
    family: claude
    pool: claude
    model: "@plan"
    effort: ""
    role: review
    read_only: hard
    reads_files: true
    timeout_minutes: 40
    enabled: true
  max:
    harness: omp
    family: claude
    pool: claude
    model: "@slow"
    effort: ""
    role: review
    read_only: hard
    reads_files: true
    timeout_minutes: 45
    enabled: true
buckets:
  trivial: trivial
  small: small
  medium: medium
  large: large
  huge: huge
  max: max
classifier:
  unavailable_bucket: max
  gate_paths:
    - src/theseus_reviewer/*
    - pyproject.toml
    - uv.lock
    - .github/workflows/*
    - tests/unit/reviewer/*
    - tests/integration/*
    - .github/review.yml
    - .github/review-omp-config.yml
    - .github/theseus-lock.json
    - .github/soundness-paths.txt
    - tests/unit/test_theseus_pin.py
    - tools/review_eval.py
    - evals/*
  logic_paths: []
  data_paths: []
promotion:
  package: theseus-reviewer
  repository: joeharris76/theseus
  dependencies: {}
